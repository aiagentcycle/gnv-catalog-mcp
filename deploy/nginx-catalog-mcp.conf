# Public name for the read-only catalog MCP. The app listens on 127.0.0.1:8325 and serves
# /mcp, /healthz, /mcp/server-card, /.well-known/ai-catalog.json, /llms.txt, /robots.txt and /icon-192.png.
# The app checks Origin on /mcp itself; nginx passes the client's Origin through unchanged.
# The app logs no IP addresses, so no client address is forwarded.
limit_req_zone $binary_remote_addr zone=catalog_ip:10m rate=5r/s;

server {
    listen 80;
    server_name catalog-mcp.goodnaturevibe.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24: http2 as a listen parameter.
    listen 443 ssl http2;
    server_name catalog-mcp.goodnaturevibe.com;
    server_tokens off;
    client_max_body_size 64k;

    ssl_certificate /etc/letsencrypt/live/catalog-mcp.goodnaturevibe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalog-mcp.goodnaturevibe.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /mcp {
        limit_req zone=catalog_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8325;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=catalog_ip burst=20 nodelay;
        limit_req_status 429;
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8325;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 30s;
    }
}
